name: Build and Deploy Portfolio

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Static Export (Offloaded to GitHub 16GB RAM)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm ci
          npm run build

      # Connect into WireGuard VPN network to access the protected VPS
      - name: Connect to WireGuard VPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      # Verify WireGuard tunnel connection and ping to VPS
      - name: Verify WireGuard Connection
        timeout-minutes: 1
        run: |
          echo "=== WireGuard Interface Status ==="
          sudo wg show
          echo "=== Testing Connectivity to VPS_HOST ==="
          ping -c 2 -W 2 ${{ secrets.VPS_HOST }} || echo "Ping failed (ignored, firewall drops ICMP)"
          nc -zv -w 5 ${{ secrets.VPS_HOST }} 22 || echo "Port 22 check warning (proceeding to SSH)"

      - name: Deploy Frontend and Update Backend via SSH
        timeout-minutes: 5
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          # Fix Windows CRLF (\r\n) and ensure trailing newline so OpenSSH libcrypto parses cleanly
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fail fast: ConnectTimeout=10, BatchMode=yes (prevents interactive hangs), keepalives
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=2"

          echo "=== 1. Syncing Frontend Static Files to VPS ==="
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key $SSH_OPTS" frontend/out/ "$VPS_USER@$VPS_HOST:/var/www/portfolio/frontend_dist/"

          echo "=== 2. Updating Backend and Refreshing Caches ==="
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF'
            set -e
            cd /var/www/portfolio
            git pull origin master
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            sudo chown -R www-data:www-data storage bootstrap/cache
          EOF
