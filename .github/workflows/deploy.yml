name: Build and Deploy Portfolio

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Quality Gate (Lint, Typecheck, Behavioral Specs)
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run lint
          cd ..
          node --test tests/p0_p1_behavioral_spec.test.mjs

      - name: Build Next.js Static Export (Offloaded to GitHub 16GB RAM)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm run build

      # Connect into WireGuard VPN network to access the protected VPS
      - name: Connect to WireGuard VPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          # Restrict AllowedIPs so the VPN does not hijack default routes or terminate GitHub Actions control plane network
          sudo sed -i 's|AllowedIPs\s*=\s*0.0.0.0/0|AllowedIPs = ${{ secrets.VPS_HOST }}/32|g' /etc/wireguard/wg0.conf
          # Strip DNS overrides if present to preserve runner DNS resolution
          sudo sed -i '/^DNS\s*=/d' /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          # Ensure explicit route to VPS host exists on wg0 interface
          sudo ip route add ${{ secrets.VPS_HOST }}/32 dev wg0 2>/dev/null || true

      # Verify WireGuard tunnel connection and ping to VPS
      - name: Verify WireGuard Connection
        run: |
          echo "=== WireGuard Interface Status ==="
          sudo wg show
          echo "=== Route Table ==="
          ip route show
          echo "=== Testing Connectivity to VPS_HOST ==="
          ping -c 2 -W 3 ${{ secrets.VPS_HOST }} || echo "Ping failed"
          nc -zv -w 5 ${{ secrets.VPS_HOST }} 22 || echo "Port 22 unreachable"

      # Ensure VPS_USER has write permissions to the deployment target before rsync runs
      - name: Prepare Deployment Directory on VPS
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo mkdir -p /var/www/portfolio/frontend_dist && sudo chown -R ${{ secrets.VPS_USER }}:www-data /var/www/portfolio/frontend_dist && sudo chmod -R 775 /var/www/portfolio/frontend_dist"

      # Deploy Frontend Static Files to VPS
      - name: Deploy Frontend Static Files to VPS
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "frontend/out/"
          TARGET: "/var/www/portfolio/frontend_dist"
          EXCLUDE: "/node_modules/"
          ARGS: "-rltvzc -i --delete --no-owner --no-group"

      # Update Backend & Run Migrations on VPS via Native Host SSH
      - name: Update Backend & Run Migrations on VPS
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            if [ -d '/var/www/portfolio' ] && [ -d '/var/www/portfolio/.git' ]; then
              cd /var/www/portfolio
              git fetch origin master
              git checkout master
              git pull origin master
              if [ -d 'backend' ] && [ -f 'backend/artisan' ]; then
                cd backend
                composer install --no-dev --optimize-autoloader || true
                php artisan migrate --force
                php artisan optimize:clear || true
                php artisan optimize || true
                sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
              fi
            fi
          "

      # Sets ownership and permissions for Nginx
      - name: Set Permissions on VPS via SSH
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo chown -R ${{ secrets.VPS_USER }}:www-data /var/www/portfolio/frontend_dist && sudo chmod -R 755 /var/www/portfolio/frontend_dist"

      - name: Disconnect WireGuard VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true
