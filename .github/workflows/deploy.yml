name: Build and Deploy Portfolio

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository with nested frontend submodule
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 2. Setup Node.js with package caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Offload compilation to GitHub's free 16GB runner (0 MB VPS RAM impact)
      - name: Build Next.js Static Export (Offloaded to GitHub 16GB RAM)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm ci
          npm run build

      # 4. Connect into WireGuard VPN network to access the protected VPS
      - name: Connect to WireGuard VPN
        uses: alessfg/wireguard-action@v1
        with:
          wireguard_conf: ${{ secrets.WIREGUARD_CONFIG }}

      # 5. Sync frontend static build files directly to the VPS over WireGuard
      - name: Deploy Frontend Static Files to VPS
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "frontend/out/"
          TARGET: "/var/www/portfolio/frontend_dist"
          EXCLUDE: "/node_modules/"

      # 6. Update Laravel backend & refresh caches over SSH
      - name: Update Backend on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/portfolio
            git pull --recurse-submodules origin main
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            sudo chown -R www-data:www-data storage bootstrap/cache
