<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Structure Not Found | Aryo</title>
  <meta name="theme-color" content="#800020">
  <link rel="icon" type="image/svg+xml" href="logo-svg.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #F7F4EE;
      --text: #1A1A1A;
      --muted: #4A4A4A;
      --accent: #800020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0C0C0D;
        --text: #F0EDE6;
        --muted: #A3A3A3;
        --accent: #A31D36;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .code {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(36px, 6vw, 54px);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 16px 0;
    }
    h1 em {
      font-style: italic;
      color: var(--accent);
    }
    p {
      font-size: 15px;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.6;
      margin: 0 0 32px 0;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="code">Error 404 — Routing Fault</div>
  <h1>Structure Not Found<em>.</em></h1>
  <p>The requested coordinate does not exist in this architectural matrix. It may have been relocated or decommissioned.</p>
  <a href="/">Return to Portfolio <span>→</span></a>
</body>
</html>
