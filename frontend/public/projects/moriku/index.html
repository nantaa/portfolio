  <!-- Global Route Fallback Helper & Standalone Inertia Bootstrap for Moriku -->
  <script>
    window.__DNP_INITIAL_PAGE__ = {
      component: "Kanban/Index",
      props: {
        auth: { user: { id: 1, name: "Aryo Rifai", role: "superadmin" }, permissions: "superadmin" },
        jobs: [
          { id: 1, kode: "DNP-2026-001", spk: "SPK-2026-0891", company_name: "PT Semen Nusantara Tbk", nama_alat: "Overhead Crane 50T (3 Unit)", stage: "4", status: "in_progress", created_at: "2026-08-10", inspectors: [], documents: [], unitsTracking: [], historyLogs: [] },
          { id: 2, kode: "DNP-2026-002", spk: "SPK-2026-0902", company_name: "PT Astra Auto Component", nama_alat: "Forklift Diesel 5T (5 Unit)", stage: "8", status: "in_progress", created_at: "2026-08-15", inspectors: [], documents: [], unitsTracking: [], historyLogs: [] },
          { id: 3, kode: "DNP-2026-003", spk: "SPK-2026-0915", company_name: "RSUD Harapan Bangsa", nama_alat: "Passenger Lift 1000kg (2 Unit)", stage: "10", status: "in_progress", created_at: "2026-08-20", inspectors: [], documents: [], unitsTracking: [], historyLogs: [] },
          { id: 4, kode: "DNP-2026-004", spk: "SPK-2026-0920", company_name: "PT Indofood CBP Sukses Makmur", nama_alat: "Bejana Tekan & Kompresor", stage: "1", status: "in_progress", created_at: "2026-08-25", inspectors: [], documents: [], unitsTracking: [], historyLogs: [] }
        ],
        inspectors: []
      },
      url: "/kanban",
      version: "1.0.0"
    };

    window.route = window.route || function(name, params) {
      var routes = {
        'login': '/login',
        'logout': '/logout',
        'dashboard': '/',
        'kanban': '/kanban',
        'jobs.index': '/jobs',
        'jobs.create': '/jobs/create',
        'jobs.store': '/jobs',
        'reminder.suket': '/reminder-suket',
        'inventory': '/inventory',
        'pelaporan.index': '/pelaporan',
        'profile.edit': '/profile',
        'users.index': '/users'
      };
      var target = routes[name] || ('/' + (name || '').replace(/\./g, '/'));
      if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        return qs ? target + '?' + qs : target;
      }
      return target;
    };

    // Escape key bridge to parent modal
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.parent.postMessage('close-modal', '*');
      }
    });

    // Offline Inertia XHR & Fetch Interceptor — prevents static server HTML/root (/) from loading inside modal
    (function() {
      var isStaticAsset = function(url) {
        return /\.(js|mjs|css|png|jpg|jpeg|webp|svg|ico|woff2?|ttf|json|glb|gltf)(\?|$)/i.test(url || '');
      };
      var isLocalBackendRoute = function(url) {
        if (!url || typeof url !== 'string') return false;
        if (url.indexOf('http') === 0 && url.indexOf(window.location.origin) !== 0) return false;
        var clean = url.replace(window.location.origin, '');
        return clean.indexOf('/') === 0 && !isStaticAsset(clean);
      };

      // 1. Intercept XMLHttpRequest (Axios / Inertia)
      var OrigOpen = XMLHttpRequest.prototype.open;
      var OrigSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function(method, url) {
        this._morikuMethod = (method || 'GET').toUpperCase();
        this._morikuUrl = url;
        return OrigOpen.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function(body) {
        if (isLocalBackendRoute(this._morikuUrl)) {
          var xhr = this;
          setTimeout(function() {
            var payload = JSON.stringify(window.__DNP_INITIAL_PAGE__);
            Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
            Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
            Object.defineProperty(xhr, 'statusText', { value: 'OK', configurable: true });
            Object.defineProperty(xhr, 'responseText', { value: payload, configurable: true });
            Object.defineProperty(xhr, 'response', { value: payload, configurable: true });
            Object.defineProperty(xhr, 'responseURL', { value: window.location.href, configurable: true });
            xhr.getResponseHeader = function(name) {
              var n = (name || '').toLowerCase();
              if (n === 'x-inertia') return 'true';
              if (n === 'content-type') return 'application/json';
              return null;
            };
            xhr.getAllResponseHeaders = function() {
              return 'x-inertia: true\r\ncontent-type: application/json\r\n';
            };
            if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
            xhr.dispatchEvent(new Event('readystatechange'));
            if (typeof xhr.onload === 'function') xhr.onload();
            xhr.dispatchEvent(new ProgressEvent('load'));
          }, 15);
          return;
        }
        return OrigSend.apply(this, arguments);
      };

      // 2. Intercept window.fetch
      if (window.fetch) {
        var origFetch = window.fetch;
        window.fetch = function(input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if (isLocalBackendRoute(url)) {
            return Promise.resolve(new Response(JSON.stringify(window.__DNP_INITIAL_PAGE__), {
              status: 200,
              headers: { 'Content-Type': 'application/json', 'X-Inertia': 'true' }
            }));
          }
          return origFetch.apply(this, arguments);
        };
      }

      // 3. Guard history.pushState / replaceState from mutating URL to /
      var origPush = history.pushState;
      var origReplace = history.replaceState;
      history.pushState = function(state, title, url) {
        if (url && typeof url === 'string' && url.indexOf('/projects/moriku') === -1) return;
        return origPush.apply(history, arguments);
      };
      history.replaceState = function(state, title, url) {
        if (url && typeof url === 'string' && url.indexOf('/projects/moriku') === -1) return;
        return origReplace.apply(history, arguments);
      };
    })();
  </script>
