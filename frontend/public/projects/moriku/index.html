        ],
        inspectors: []
      },
      url: "/kanban",
      version: "1.0.0"
    };

    window.route = window.route || function(name, params) {
      var routes = {
        'login': '/login',
        'logout': '/logout',
        'dashboard': '/',
        'kanban': '/kanban',
        'jobs.index': '/jobs',
        'jobs.create': '/jobs/create',
        'jobs.store': '/jobs',
        'reminder.suket': '/reminder-suket',
        'inventory': '/inventory',
        'pelaporan.index': '/pelaporan',
        'profile.edit': '/profile',
        'users.index': '/users'
      };
      var target = routes[name] || ('/' + (name || '').replace(/\./g, '/'));
      if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        return qs ? target + '?' + qs : target;
      }
      return target;
    };

    // Escape key bridge to parent modal
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.parent.postMessage('close-modal', '*');
      }
    });
