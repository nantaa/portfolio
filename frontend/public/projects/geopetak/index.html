<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/geopetak-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoPetak | Spatial AI Platform</title>
    <meta
      content="GeoPetak builds spatial intelligence systems powered by world models, translating spatial physics into financial advantage and exposure across Indonesia."
      name="description"
    />

    <!-- Base layout CSS (local) -->
    <link href="./assets/css/geolava-dev.webflow.shared.d563da239.min.css" rel="stylesheet" type="text/css" />

    <!-- JS / touch class flags for CSS media selectors -->
    <script type="text/javascript">
      !(function (o, c) {
        var n = c.documentElement, t = " w-mod-";
        n.className += t + "js";
        ("ontouchstart" in o || (o.DocumentTouch && c instanceof DocumentTouch)) && (n.className += t + "touch");
      })(window, document);
    </script>

    <!-- Local typography & CSS variables -->
    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url('./assets/DMSans-VariableFont.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      *, *:after, *:before {
        box-sizing: border-box;
      }
      html { scroll-behavior: smooth; }
      html, body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
        margin: 0; padding: 0;
        background-color: #f7f6f1;
      }
      h1,h2,h3,h4,h5,h6,p,blockquote,label {
        font-family: inherit; font-size: inherit; font-weight: inherit;
        line-height: inherit; letter-spacing: inherit; margin-top: 0; margin-bottom: 0;
      }
      button { background-color: unset; padding: unset; text-align: inherit; cursor: pointer; }
      a { color: inherit; }
      svg { display: block; max-width: none; }
      video { width: 100%; -o-object-fit: cover; object-fit: cover; }

      :root {
        --size-unit: 16;
        --size-container-ideal: 1440;
        --size-container-min: 992px;
        --size-container-max: 1920px;
        --size-container: clamp(var(--size-container-min), 100vw, var(--size-container-max));
        --size-font: calc(var(--size-container) / (var(--size-container-ideal) / var(--size-unit)));
        --cubic-default: cubic-bezier(0.65, 0.05, 0, 1);
        --duration-default: 0.735s;
        --animation-default: var(--duration-default) var(--cubic-default);
      }
      @media screen and (max-width: 991px) {
        :root {
          --size-container-ideal: 900;
          --size-container-min: 768px;
          --size-container-max: 991px;
        }
      }
      @media screen and (max-width: 767px) {
        :root {
          --size-container-ideal: 390;
          --size-container-min: 320px;
          --size-container-max: 767px;
        }
      }

      #app { display: contents; }
    </style>
    <script type="module" crossorigin src="./assets/index-Ce5J52nT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-m2YO004T.css">
    <style>
      html, body, #app, * {
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      @media print {
        body { display: none !important; visibility: hidden !important; }
      }
    </style>
    <script>
      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          window.parent.postMessage('close-modal', '*');
        }
      });
      ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(function(evt) {
        window.addEventListener(evt, function(e) { e.preventDefault(); }, true);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
