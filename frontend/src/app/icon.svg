<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141619" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <linearGradient id="strutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#ECEEF2" />
      <stop offset="100%" stop-color="#A2A7B5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8243A" />
      <stop offset="50%" stop-color="#9B1E30" />
      <stop offset="100%" stop-color="#6E101E" />
    </linearGradient>
  </defs>

  <!-- Architectural App Tile / Badge -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Technical Construction Guides -->
  <circle cx="128" cy="128" r="88" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="28" y1="128" x2="228" y2="128" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="6 6" />
  <line x1="128" y1="28" x2="128" y2="228" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="6 6" />
  <line x1="36" y1="148" x2="220" y2="148" stroke="rgba(184,36,58,0.2)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Monogram Geometry: Structural Beams -->
  <!-- Left Diagonal Strut -->
  <polygon points="128,44 150,44 70,206 46,206" fill="url(#strutGrad)" />
  
  <!-- Right Diagonal Strut -->
  <polygon points="106,44 128,44 210,206 186,206" fill="url(#strutGrad)" />
  
  <!-- Apex Key Join -->
  <polygon points="114,44 142,44 128,68" fill="#FFFFFF" />

  <!-- Architectural Cantilever Crossbar -->
  <rect x="68" y="138" width="120" height="20" rx="2" fill="url(#accentGrad)" />

  <!-- Signature Brand Dot (Aryo.) -->
  <circle cx="220" cy="198" r="9" fill="url(#accentGrad)" />
</svg>
